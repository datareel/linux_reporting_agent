# DRSM plugin manifest, see PLUGINS.md "Hook uploads"
# Copy this folder to <drsm>/plugins/uploads/auth_watch on the monitor
# host; hook.php reads it from [hooks] manifest_dir.
NAME=auth_watch
CATEGORY=uploads
DESCRIPTION="Failed and accepted logins (utils/auth_watch), remote apart from the host's own"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# auth_watch --submit sends DRSM lines: DETAIL values for the rules
# (remote_failed, remote_invalid_user, remote_sources, local_failed, ...)
# and the same table as its CSV output (UPLOAD columns/row lines). The
# csv format would only give the rules a row count.
FORMAT=drsm-lines
MAX_BYTES=2000000
KEEP_HISTORY=24
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_auth_watch_<SETTING>=value
TITLE="Login attempts"
PLACE=host-section
DISPLAY=table
# auth_watch runs from cron every 15 minutes: old data means it stopped
MAX_AGE_HOURS=2
# Only remote attempts alert: localhost sshd and local password prompts
# (gdm, polkit, sudo, su) are in the table but not in these values
CRIT_IF="remote_failed >= 50"
WARN_IF="remote_failed > 0 or remote_invalid_user > 0 or remote_too_many > 0"
METRICS="remote_failed remote_invalid_user remote_sources remote_accepted local_failed"
MAX_LINES=1000
