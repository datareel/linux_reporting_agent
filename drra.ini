; DataReel Reporting Agent for Linux: settings
;
; Installed as /etc/drra/drra.ini (root only, it holds the enrollment
; token). The agent re-reads it before every report, so changes take
; effect on the next cycle without a restart; "systemctl reload drra"
; starts that cycle now. Any setting left out uses the default shown here.

[delivery]
; How to deliver the report. List one or more, separated by commas.
; Every listed method runs each cycle.
;   https - signed POST to the upload page on a web server (php/upload.php).
;           Works over the internet: the host only makes outgoing HTTPS
;           connections, nothing connects to it.
;   cifs  - copy to a Windows (SMB/CIFS) file share with smbclient
;   scp   - copy over SSH with scp
methods=https

[https]
; Report server that receives the uploads
host=reports.example.com
; 443 for HTTPS, 80 for HTTP
port=443
; Upload script on the report server (see php/upload.php)
upload_path=/linux/upload/upload.php
; Registration script. The agent registers its certificate here before it
; sends any report, and only uploads once the server has approved it.
register_path=/linux/upload/register.php
; Shared secret from enrollment_token in the server's server.ini. With the
; right token the agent is approved automatically. Leave empty to have an
; admin approve each agent on admin.php instead.
enrollment_token=
; 1 = HTTPS, 0 = plain HTTP (only for a test server)
use_https=1
; 1 = check the server certificate and host name. Only set 0 for a test
; server with a self-signed certificate; use ca_file for a private CA.
verify_peer=1
; CA bundle (PEM) for a server certificate from a private CA. Empty uses
; the system trust store.
ca_file=
; Seconds before an upload is given up
timeout_seconds=60

[cifs]
; Share, for example //fileserver/reports
share=
; Folder inside the share, empty for the top of the share
directory=
; Share login in smbclient -A format, root only (chmod 600):
;   username = reports
;   password = secret
;   domain   = WORKGROUP
; Empty for a guest share.
credentials_file=/etc/drra/cifs_credentials
smbclient_path=/usr/bin/smbclient
timeout_seconds=120

[scp]
; SSH server and account that receive the report
host=
port=22
user=
; Private key with no passphrase, root only (chmod 600)
key_file=/etc/drra/id_ed25519
; Directory on the server, for example /var/www/html/linux/reports
remote_dir=
; known_hosts file for the server's host key
known_hosts_file=/var/lib/drra/known_hosts
; yes        = only connect to a host key already in known_hosts (safest)
; accept-new = save the host key on the first connection, then require it
strict_host_key_checking=yes
scp_path=/usr/bin/scp
; Seconds before a hung transfer is stopped
timeout_seconds=120

[agent]
; Minutes between reports, 1 or more. 15 matches the DRSM check
; interval, so DRSM always has a fresh report.
report_interval_minutes=15
; Seconds the CPU use is sampled for
cpu_sample_seconds=5
; Directory where the report file is written before it is sent
report_dir=/var/lib/drra
; Log of every report and upload, including the agent key fingerprint
log_file=/var/log/drra/drra.log
; Agent key (agent_key.pem, root only), certificate, registration and
; scan results. The key fingerprint to check before approving an agent:
;   drra fingerprint
data_dir=/var/lib/drra
; 1 = list the pending package updates (dnf check-update, from the
; metadata cache)
check_updates=1
; Hours between "dnf makecache" runs that keep the update and
; vulnerability data current. 0 = never, leave it to dnf-makecache.timer.
updates_refresh_hours=24
; Seconds before a command the agent runs (rpm, dnf, systemctl) is stopped
command_timeout_seconds=300

[scan]
; Vulnerability scan: the Red Hat security advisories that apply to this
; host, with their severity and CVEs. 1 = on, 0 = off
enabled=1
; Hours between scans. A scan takes from seconds to a few minutes.
interval_hours=24
; Where the advisories come from:
;   auto - OpenSCAP with Red Hat's OVAL feed on RHEL 8 and 9, dnf
;          updateinfo elsewhere (Red Hat publishes no OVAL feed for
;          RHEL 10)
;   oval - always OpenSCAP: oscap oval eval against oval_feed_url
;   dnf  - always dnf updateinfo (the repositories' security errata)
source=auto
; OVAL feed, https URL or local file, .xml or .xml.bz2. Empty picks Red
; Hat's feed for this release, for example
; https://security.access.redhat.com/data/oval/v2/RHEL9/rhel-9.oval.xml.bz2
oval_feed_url=
oscap_path=/usr/bin/oscap
; 1 = send the OpenSCAP HTML reports to the server after each scan
upload_html=1
; Compliance scan with a SCAP Security Guide profile (scap-security-guide
; package), for example cis_server_l1, stig, pci-dss, or the full
; xccdf_org.ssgproject.content_profile_... id. Empty = no compliance scan.
; List the profiles with: oscap info /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
compliance_profile=
; SCAP data stream for the compliance scan. Empty picks
; /usr/share/xml/scap/ssg/content/ssg-rhel<release>-ds.xml
compliance_datastream=
; Minutes before a scan is stopped
timeout_minutes=60
